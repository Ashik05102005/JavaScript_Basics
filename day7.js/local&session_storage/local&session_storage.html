<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello world</h1>
    <script>
        //local storage
        localStorage.setItem("name","Ashik");
        localStorage.setItem("age",20);
        localStorage.setItem("place","ndm");
        localStorage.removeItem("place")
        console.log(localStorage.getItem("name"))
        console.log(localStorage.getItem("age"))
        console.log(localStorage.getItem("place"))
        //session storage
        sessionStorage.setItem("name","Ashik");
        sessionStorage.setItem("age",20);
        sessionStorage.setItem("place","ndm");
        sessionStorage.removeItem("place")
        console.log(sessionStorage.getItem("name"))
        console.log(sessionStorage.getItem("age"))
        console.log(sessionStorage.getItem("place"))
        

    </script>
</body>
</html>
